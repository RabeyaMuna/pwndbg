name: Unit tests
on: push

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    services:
      pypi_wayback:
        image: ghcr.io/waleko/pypi-wayback
        ports:
        - 8629:8080
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v3
    - name: Cache for pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ matrix.os }}-cache-pip

    - name: Wait for pypi_wayback or fallback to PyPI
      run: |
        MAX_RETRIES=5
        RETRY=0
        until curl -sf http://localhost:8629/2024-01-03/pip/ > /dev/null; do
          RETRY=$((RETRY + 1))
          if [ $RETRY -ge $MAX_RETRIES ]; then
            echo "pypi_wayback not available after $MAX_RETRIES retries, falling back to real PyPI"
            echo "PIP_INDEX_URL=https://pypi.org/simple" >> $GITHUB_ENV
            echo "UV_INDEX_URL=https://pypi.org/simple" >> $GITHUB_ENV
            break
          fi
          echo "Waiting for pypi_wayback... attempt $RETRY/$MAX_RETRIES"
          sleep 2
        done

    - name: Install dependencies
      run: |
        ./setup.sh
        ./setup-dev.sh

    - name: Python version info
      run: |
        echo 'GDB py:'
        gdb --batch --quiet --nx --nh --ex 'py import sys; print(sys.version)'
        echo 'Installed py:'
        ./.venv/bin/python -V
        echo 'Installed packages:'
        ./.venv/bin/python -m pip freeze

    # We set `kernel.yama.ptrace_scope=0` for `attachp` command tests
    - name: Run tests
      run: |
        mkdir .cov
        sudo sysctl -w kernel.yama.ptrace_scope=0
        ./tests.sh --cov

    - name: Process coverage data
      if: matrix.os == 'ubuntu-22.04'
      run: |
        ./.venv/bin/coverage combine
        ./.venv/bin/coverage xml

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-22.04'
      uses: codecov/codecov-action@v3

  qemu-tests:
    runs-on: [ubuntu-22.04]
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v3

    - name: Cache for pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ matrix.os }}-cache-pip

    - name: Wait for pypi_wayback or fallback to PyPI
      run: |
        MAX_RETRIES=5
        RETRY=0
        until curl -sf http://localhost:8629/2024-01-03/pip/ > /dev/null; do
          RETRY=$((RETRY + 1))
          if [ $RETRY -ge $MAX_RETRIES ]; then
            echo "pypi_wayback not available after $MAX_RETRIES retries, falling back to real PyPI"
            echo "PIP_INDEX_URL=https://pypi.org/simple" >> $GITHUB_ENV
            echo "UV_INDEX_URL=https://pypi.org/simple" >> $GITHUB_ENV
            break
          fi
          echo "Waiting for pypi_wayback... attempt $RETRY/$MAX_RETRIES"
          sleep 2
        done

    - name: Install dependencies
      run: |
        ./setup.sh
        ./setup-dev.sh
        mkdir .cov

    - name: Set up cache for QEMU images
      id: qemu-cache
      uses: actions/cache@v3
      with:
        path: ./tests/qemu-tests/images
        key: ${{ matrix.os }}-cache-qemu-images

    - name: Download images
      run: |
        ./tests/qemu-tests/download_images.sh

    # We set `kernel.yama.ptrace_scope=0` for `gdb-pt-dump`
    - name: Run tests
      working-directory: ./tests/qemu-tests
      run: |
        sudo sysctl -w kernel.yama.ptrace_scope=0
        ./tests.sh --cov

    - name: Run qemu-user tests
      working-directory: ./tests/qemu-tests
      run: |
        ./test_qemu.sh

    - name: Process coverage data
      run: |
        ./.venv/bin/coverage combine
        ./.venv/bin/coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3

env:
  PIP_INDEX_URL: http://localhost:8629/2024-01-03
  UV_INDEX_URL: http://localhost:8629/2024-01-03
